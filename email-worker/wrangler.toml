name = "garage-email"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "garage-db"
database_id = "e6d7164f-47c7-4d1a-b7a9-53fc8b733133"

# Photos emailed in land in the same bucket the builder uploads to, so they are
# served by the existing /images/<key> route.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "garage-images"
