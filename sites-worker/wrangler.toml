name = "garage-sites"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Every subdomain of garage.co.nz is served from D1 by this worker.
# Needs a proxied wildcard DNS record (*.garage.co.nz) for requests to arrive.
routes = [
  { pattern = "*.garage.co.nz/*", zone_name = "garage.co.nz" }
]

[[d1_databases]]
binding = "DB"
database_name = "garage-db"
database_id = "e6d7164f-47c7-4d1a-b7a9-53fc8b733133"

# One an hour, which is the normal rate. It ran at three an hour from 28 to 30
# Aug 2026 for a stress test, so template changes showed up in new sites within
# the hour instead of the next morning.
#
# This number and MAX_PER_DAY in src/pages/api/cron/spawn.ts have to move
# together: raise the trigger without raising the ceiling and the job stops
# partway through the day, and the log gives no hint why.
#
# It costs money. Each run calls the Anthropic API with a key billed as
# pay-as-you-go credit — not against a Claude subscription, and not on anybody's
# laptop. This worker runs in Cloudflare whether a machine is on or not.
[triggers]
crons = ["0 * * * *"]
